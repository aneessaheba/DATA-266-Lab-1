# Manifest for anees_saheba, Task 1
# Brief section 5: package and library versions, environment file, and which
# checkpoint maps to which result in the report.
# Filled in from the run itself, using the raw log and the recorded metrics.

member: anees_saheba
task: task1_llm

hardware:
  machine: "Apple Mac16,12"
  cpu: "Apple M4, 10 cores, 4 performance and 6 efficiency"
  gpu: "Apple M4 integrated, 10 cores, used through PyTorch MPS"
  gpu_memory_gb: "unified with system memory, 32 GB total"
  ram_gb: "32"
  os: "macOS 26.6.2, build 25G83"
  cuda_version: "not applicable, trained on Apple MPS"
  driver_version: "not applicable, trained on Apple MPS"

environment:
  python: "3.11.8"
  env_file: "environment/requirements.txt"
  pip_freeze: "environment/requirements.txt, captured from the working virtual environment"
  key_versions:
    torch: "2.14.0"
    numpy: "2.4.6"
    matplotlib: "3.11.2"
  random_seed: "5330"
  seeded: "python random, numpy, torch, and the DataLoader generator"

runs:
  - run_id: "20261004_212529"
    status: "reported run, all numbers in results.md and metrics_report.csv come from this"
    config: "task1_llm/anees_saheba/src/configs/char_gpt_config.yaml"
    command: >
      jupyter nbconvert --to notebook --execute
      task1_llm/anees_saheba/src/char_gpt_tinystories.ipynb
      --output run_task1_full.ipynb
      --ExecutePreprocessor.timeout=86400
      --ExecutePreprocessor.kernel_name=data266-venv
    raw_log: "reproducibility/raw_logs/task1_gpt_20261004_212529.log"
    checkpoint: "task1_llm/anees_saheba/checkpoints/best_model.pt"
    maps_to_report_result: >
      Every row of task1_llm/anees_saheba/metrics_report.csv, the results table
      in section 5 of results.md, the loss curves in outputs/loss_curves.png,
      and all three snippets in failure_analysis.md.
    start_time: "2026-10-04 21:25:29"
    end_time: "2026-10-04 22:25:13"
    epochs_completed: 10
    headline_metrics:
      val_cross_entropy_loss: 0.7538
      perplexity: 2.125
      bits_per_character: 1.0875
      top1_next_char_accuracy: 0.7607
      parameter_count: 3238912
      total_training_time_sec: 3556.96
      peak_memory_gb: 1.104
    notes: >
      Checkpoint saved at epoch 10, which had the lowest validation loss.
      No loss spikes and no non finite steps across 15,620 optimiser steps.

  - run_id: "20261002_212332"
    status: "superseded, kept as evidence"
    config: "same architecture, seed 4350 instead of 5330"
    command: "same as the reported run"
    raw_log: "reproducibility/raw_logs/task1_gpt_20261002_212332_seed4350_superseded.log"
    checkpoint: "not retained, overwritten by the reported run"
    maps_to_report_result: >
      Not used for any reported number. Quoted in section 5 of results.md as a
      seed sensitivity check: bits per character 1.0823 against 1.0875 and top 1
      accuracy 76.15 against 76.07 percent, a difference under 0.5 percent.
    start_time: "2026-10-02 21:23:32"
    end_time: "2026-10-03 11:59:58"
    epochs_completed: 10
    notes: >
      Run with the seed assigned in the team handoff. Rerun afterwards with my
      own student ID as the seed, which changes both the initialisation and the
      train and validation split.

  - run_id: "20261002_205302"
    status: "partial, stopped externally"
    config: "same architecture, seed 4350"
    command: "same as the reported run"
    raw_log: "reproducibility/raw_logs/task1_gpt_20261002_205302_PARTIAL_killed_at_step10600.log"
    checkpoint: "not retained"
    maps_to_report_result: "none, no number in the report comes from this run"
    start_time: "2026-10-02 20:53:02"
    end_time: "2026-10-02 21:22:54"
    epochs_completed: 6
    notes: >
      Stopped by an external process time limit at step 10,600 of 15,620. The
      log is kept unedited and renamed to mark it partial, because section 5
      asks for raw logs to be preserved rather than removed.

reproduction:
  one_command: >
    jupyter nbconvert --to notebook --execute
    task1_llm/anees_saheba/src/char_gpt_tinystories.ipynb
    --output run.ipynb --ExecutePreprocessor.timeout=86400
  data_prerequisite: "bash scripts/download_data.sh task1"
  expected_runtime: "about 59 minutes on Apple M4 MPS, faster on a CUDA GPU"
  notes: >
    No path in the notebook is hard coded. The data file is located relative to
    the repository root, and DATA266_TINYSTORIES overrides it if the data lives
    elsewhere.
