kaggle:
  submitted: "2026-10-06"
  file: "task3_gan/anees_saheba/outputs/submission.csv"
  produced_by: "task3_gan/anees_saheba/src/make_kaggle_submission.py"
  submitted_fid: 105.2606
  submitted_mifid: 0.4175
  public_score: -52.8390
  teammate_public_score: -54.6990
  scoring: >
    The competition takes a one row csv with ID, FID and MiFID, and the
    leaderboard shows the negative mean of the two. The script embeds the
    instructor's scoring logic unchanged. The run itself only translated 30 of
    the 300 Monet paintings, so the remaining 270 were generated from the saved
    epoch 50 checkpoint before scoring. No retraining.

pending:
  human_audit: >
    outputs/metrics/human_audit_30_samples.csv is a 30 row template with empty
    rater columns. It needs two people. The notebook does not generate ratings.

reproduction:
  one_command: >
    jupyter nbconvert --to notebook --execute
    task3_gan/anees_saheba/src/cyclegan_monet_photo.ipynb
    --output run.ipynb --ExecutePreprocessor.timeout=86400
  data_prerequisite: >
    monet_jpg and photo_jpg under task3_gan/data/, 300 and 7,038 images. The
    notebook also accepts DATA266_MONET_DIR and DATA266_PHOTO_DIR.
  expected_runtime: "about 8.9 hours on an RTX 4090, about 5 hours on an RTX 5090"
  notes: >
    No path in the notebook is hard coded. DATA266_NUM_EPOCHS,
    DATA266_IMAGE_SIZE and DATA266_CHECKPOINT_EVERY allow a shortened run
    without editing the file. Time one epoch before committing to a GPU slot.
